name: Case Log Automation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_case_log:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get a copy of the repo onto the runner
      - name: Get the repository code
        uses: actions/checkout@v4

              # Step 2: Add a dated note to the web page for whoever pushed
      - name: Show who triggered the workflow
        run: echo "Workflow triggered by ${{ github.actor }}"

      - name: Log Lead Investigator update
        if: github.actor == 'LioneOG'
        run: |
          sed -i '/<\/body>/i <p>Case file updated by Lead Investigator on '"$(TZ=Australia/Sydney date)"'</p>' index.html
          cat index.html

      - name: Log Member 1 update
        if: github.actor == 'member1-username'
        run: sed -i '/<\/body>/i <p>Case file updated by Member 1 on '"$(TZ=Australia/Sydney date)"'</p>' index.html

      - name: Log Member 2 update
        if: github.actor == 'member2-username'
        run: sed -i '/<\/body>/i <p>Case file updated by Member 2 on '"$(TZ=Australia/Sydney date)"'</p>' index.html

              # Step 3: Record the update in the README
      - name: Add entry to README case log
        run: |
          echo "" >> README.md
          echo "### Case log: ${{ github.actor }} updated the site on $(TZ=Australia/Sydney date '+%d/%m/%Y %H:%M') [Commit: $(git rev-parse --short HEAD)]" >> README.md
          tail -n 3 README.md

                # Step 4: Commit the updated files back to main
      - name: Save updates to the repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Auto-update: case log entry for ${{ github.actor }}" || echo "Nothing new to save"
          git push origin main
        
