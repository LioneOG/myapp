name: Witness Statement Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the case repository
        uses: actions/checkout@v4

      - name: Run the statement analyzer
        uses: ./.github/actions/statement-analyzer
        with:
          file: witness_statement.txt

      - name: Save the updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Case report: statement analysed for ${{ github.actor }}" || echo "Nothing new to save"
          git pull --rebase origin main
          git push origin main